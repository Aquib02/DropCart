name: DropCart CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Install and Test Backend
      run: |
        cd backend
        npm ci
        npm test

    - name: Install and Build Frontend
      run: |
        cd Frontend
        npm ci
        npm run build
